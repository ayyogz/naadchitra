name: naadchitra
description: "Scan Indian art, hear the instrument inside, play it yourself"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  audioplayers: ^6.1.0
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/refs/embeddings.json
    - assets/audio/
    - assets/models/
